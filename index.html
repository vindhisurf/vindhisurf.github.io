<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VINDHI · Aulas de surf em Ponta do Ouro</title>
<meta name="description" content="Aulas de surf em Ponta do Ouro, Moçambique, com instrutores locais certificados ISA e nadadores-salvadores. Aulas, pacotes e Surf &amp; Camp. Reserva no WhatsApp.">
<meta property="og:title" content="VINDHI · Aulas de surf em Ponta do Ouro">
<meta property="og:description" content="Aprende a surfar com quem é daqui. Instrutores ISA e nadadores-salvadores certificados. Reserva no WhatsApp.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#3576B0">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'DM Sans',system-ui,sans-serif;color:#0F2A44;background:#F6F2EA}
a{color:#3576B0}a:hover{color:#0F2A44}html{scroll-behavior:smooth}a,button{transition:transform .15s ease,box-shadow .15s ease,background-color .15s ease}a:hover,button:hover{transform:translateY(-1px)}a:focus-visible,button:focus-visible{outline:3px solid #9CC4E8;outline-offset:2px}@keyframes vslide{from{transform:translateX(-100%)}to{transform:none}}@keyframes vfade{from{opacity:0}to{opacity:1}}.vmq{overflow-x:auto;overflow-y:hidden;width:100vw;margin-left:calc(50% - 50vw);scrollbar-width:none;-webkit-overflow-scrolling:touch;cursor:grab}.vmq::-webkit-scrollbar{display:none}.vlb{background:#08131e}.vmq img{-webkit-user-drag:none;user-select:none;-webkit-user-select:none}.vmq-track{display:flex;gap:12px;width:max-content}.vmq-set{display:flex;gap:12px}@media (prefers-reduced-motion: reduce){nav,.vfade{animation:none!important}html{scroll-behavior:auto}a,button{transition:none}a:hover,button:hover{transform:none}}
</style>

</head>
<body>
<div id="root"></div>
<template id="tpl">
<div style="width: 100%; box-sizing: border-box; background: #F6F2EA">

<!-- Hero -->
<div style="background: #3576B0; color: #ffffff">
<div style="max-width: 1120px; margin: 0 auto; padding: 20px 20px 64px; box-sizing: border-box; display: flex; flex-direction: column; gap: 48px">
<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px">
<button onClick="{{ openMenu }}" aria-label="{{ t.menuOpen }}" aria-expanded="{{ menuOpen }}" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0; border: 0; background: transparent; color: #ffffff; font-family: inherit; cursor: pointer">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h11"/></svg>
<img src="logo.jpg" alt="" style="width: 44px; height: 44px; border-radius: 10px; object-fit: cover">
<span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 24px; letter-spacing: 0.08em">VINDHI</span>
</button>
<div style="display: flex; align-items: center; gap: 8px">
<button onClick="{{ setPt }}" aria-pressed="{{ ptOn }}" style="min-height: 44px; min-width: 44px; padding: 0 14px; border-radius: 22px; border: 1px solid #ffffff; background: {{ ptBg }}; color: {{ ptFg }}; font-family: inherit; font-weight: 700; font-size: 15px; cursor: pointer">PT</button>
<button onClick="{{ setEn }}" aria-pressed="{{ enOn }}" style="min-height: 44px; min-width: 44px; padding: 0 14px; border-radius: 22px; border: 1px solid #ffffff; background: {{ enBg }}; color: {{ enFg }}; font-family: inherit; font-weight: 700; font-size: 15px; cursor: pointer">EN</button>
</div>
</div>

<div style="display: flex; flex-wrap: wrap; gap: 40px; align-items: center">
<div style="flex: 1 1 420px; min-width: 0; display: flex; flex-direction: column; gap: 24px">
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: clamp(40px, 9vw, 56px); line-height: 1.05">{{ t.heroTitle }}</h1>
<p style="margin: 0; font-size: 20px; line-height: 1.5; max-width: 520px">{{ t.heroSub }}</p>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 16px">
<a href="{{ waLink }}" style="display: inline-flex; align-items: center; justify-content: center; min-height: 52px; padding: 0 28px; border-radius: 26px; background: #ffffff; color: #0F2A44; font-weight: 700; font-size: 17px; text-decoration: none">{{ t.cta }}</a>
<a href="#pacotes" style="display: inline-flex; align-items: center; justify-content: center; min-height: 52px; padding: 0 24px; border-radius: 26px; border: 2px solid #ffffff; color: #ffffff; font-weight: 700; font-size: 17px; text-decoration: none">{{ t.heroMaputo }}</a>
</div>
<span style="font-size: 16px; font-weight: 500">{{ t.priceChip }}</span>
<div style="display: flex; flex-direction: column; gap: 4px; max-width: 520px; padding: 14px 18px; border-radius: 14px; background: rgba(255, 255, 255, 0.12); border: 1px solid rgba(255, 255, 255, 0.35)">
<span style="font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase">{{ t.byApptTitle }}</span>
<span style="font-size: 16px; line-height: 1.5">{{ t.byApptText }}</span>
</div>
<span style="font-size: 15px; line-height: 1.5; color: #DCEAF6; border-top: 1px solid #5B8FC0; padding-top: 14px; max-width: 520px">{{ t.trust }}</span>
</div>
<div style="flex: 1 1 340px; min-width: 0">
<img src="hero.jpg" alt="{{ t.altHero }}" style="display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover; object-position: center; border-radius: 20px">
</div>
</div>
</div>
</div>

<!-- A aula -->
<div id="aula" style="max-width: 1120px; margin: 0 auto; padding: 72px 20px 24px; box-sizing: border-box; display: flex; flex-wrap: wrap; gap: 40px">
<div style="flex: 1 1 360px; min-width: 0; display: flex; flex-direction: column; gap: 16px">
<h2 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 36px; line-height: 1.1">{{ t.lessonTitle }}</h2>
<p style="margin: 0; font-size: 18px; line-height: 1.55">{{ t.lessonText }}</p>
<div style="display: flex; flex-direction: column; gap: 6px; padding-top: 8px">
<div style="font-size: 14px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #2B6296">{{ t.bringTitle }}</div>
<p style="margin: 0; font-size: 17px; line-height: 1.5">{{ t.bringText }}</p>
</div>
</div>
<div style="flex: 1 1 360px; min-width: 0; background: #ffffff; border-radius: 20px; padding: 28px; box-sizing: border-box; display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; align-items: baseline; flex-wrap: wrap; gap: 10px">
<span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 44px; color: #3576B0">2.500 MT</span>
<span style="font-size: 16px">{{ t.priceUnit }}</span>
</div>
<div style="display: inline-flex; align-self: flex-start; align-items: center; min-height: 36px; padding: 6px 14px; border-radius: 18px; background: #E2F3EA; color: #135E3D; border: 1px solid #A9D9BF; font-size: 15px; font-weight: 700; line-height: 1.35; box-sizing: border-box">{{ t.groupLine }}</div>
<div style="display: flex; flex-direction: column; gap: 12px">
<sc-for list="{{ included }}" as="item" hint-placeholder-count="5">
<div style="display: flex; align-items: flex-start; gap: 12px; font-size: 17px; line-height: 1.45">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#3576B0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 2px"><path d="M4 12.5l5 5L20 6.5"></path></svg>
<span>{{ item.text }}</span>
</div>
</sc-for>
</div>
<a href="{{ waLink }}" style="display: inline-flex; align-items: center; justify-content: center; min-height: 52px; padding: 0 28px; border-radius: 26px; background: #3576B0; color: #ffffff; font-weight: 700; font-size: 17px; text-decoration: none">{{ t.cta }}</a>
</div>
</div>

<!-- Primeira vez -->
<div style="max-width: 1120px; margin: 0 auto; padding: 32px 20px 0; box-sizing: border-box">
<div style="background: #DCEAF6; border-radius: 20px; padding: 28px; box-sizing: border-box; display: flex; flex-wrap: wrap; gap: 28px; align-items: center">
<div style="flex: 2 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 10px">
<div style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 30px; line-height: 1.2">{{ t.firstTitle }}</div>
<div style="font-size: 18px; line-height: 1.5">{{ t.firstText }}</div>
</div>
<div style="flex: 1 1 260px; min-width: 0; max-width: 420px">
<img loading="lazy" src="primeira-onda.jpg" alt="{{ t.altFirst }}" style="display: block; width: 100%; aspect-ratio: 1 / 1; object-fit: cover; object-position: center; border-radius: 16px">
</div>
</div>
</div>

<!-- Pacotes -->
<div id="pacotes" style="max-width: 1120px; margin: 0 auto; padding: 64px 20px 24px; box-sizing: border-box; display: flex; flex-direction: column; gap: 24px">
<div style="display: flex; flex-direction: column; gap: 10px">
<h2 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 36px; line-height: 1.1">{{ t.packsTitle }}</h2>
<p style="margin: 0; font-size: 18px; line-height: 1.55; max-width: 720px">{{ t.packsSub }}</p>
<div style="display: inline-flex; align-self: flex-start; align-items: center; min-height: 36px; padding: 6px 14px; border-radius: 18px; background: #E2F3EA; color: #135E3D; border: 1px solid #A9D9BF; font-size: 15px; font-weight: 700; line-height: 1.35; box-sizing: border-box">{{ t.packsGroup }}</div>
<a href="#reservar" style="display: inline-flex; align-items: center; min-height: 44px; font-size: 17px; font-weight: 700">{{ t.calcJump }}</a>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 20px">
<sc-for list="{{ packs }}" as="p" hint-placeholder-count="3">
<div style="flex: 1 1 300px; min-width: 0; background: #ffffff; border-radius: 20px; padding: 28px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px">
<div style="font-size: 14px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #2B6296">{{ p.tag }}</div>
<div style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 26px">{{ p.title }}</div>
<div style="display: flex; align-items: baseline; flex-wrap: wrap; gap: 10px">
<span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 40px; color: #3576B0">{{ p.price }} MT</span>
<span style="font-size: 16px">{{ p.per }}</span>
</div>
<div style="align-self: flex-start; display: inline-flex; align-items: center; min-height: 32px; padding: {{ p.savePad }}; border-radius: 16px; background: {{ p.saveBg }}; color: {{ p.saveFg }}; font-size: 16px; font-weight: 700; line-height: 1.3; box-sizing: border-box">{{ p.save }}</div>
<div style="font-size: 17px; line-height: 1.5">{{ p.text }}</div>
<div style="font-size: 15px; color: #2B6296">📷 {{ p.photos }}</div>
<a href="{{ p.link }}" style="display: inline-flex; align-items: center; justify-content: center; min-height: 52px; padding: 0 28px; border-radius: 26px; background: #3576B0; color: #ffffff; font-weight: 700; font-size: 17px; text-decoration: none">{{ t.packBtn }}</a>
</div>
</sc-for>
</div>
</div>

<!-- Calculadora -->
<div id="reservar" style="max-width: 1120px; margin: 0 auto; padding: 40px 20px 24px; box-sizing: border-box">
<div style="background: #0F2A44; color: #ffffff; border-radius: 24px; padding: 32px; box-sizing: border-box; display: flex; flex-direction: column; gap: 24px">
<div style="display: flex; flex-direction: column; gap: 8px">
<h2 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 34px; line-height: 1.1">{{ t.calcTitle }}</h2>
<p style="margin: 0; font-size: 17px; line-height: 1.5; color: #DCEAF6">{{ t.calcSub }}</p>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 10px">
<sc-for list="{{ calcOpts }}" as="o" hint-placeholder-count="5">
<button onClick="{{ o.onPick }}" aria-pressed="{{ o.pressed }}" style="flex: 1 1 150px; min-height: 64px; padding: 10px 16px; border-radius: 14px; border: 2px solid {{ o.border }}; background: {{ o.bg }}; color: {{ o.fg }}; font-family: inherit; cursor: pointer; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 2px; text-align: left">
<span style="font-weight: 700; font-size: 16px">{{ o.label }}</span>
<span style="font-size: 14px">{{ o.priceTxt }}</span>
</button>
</sc-for>
</div>
<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 20px; border-top: 1px solid #2B4D6E; padding-top: 20px">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px">
<span style="font-size: 16px; color: #DCEAF6">{{ t.calcPeople }}</span>
<button onClick="{{ minus }}" aria-label="{{ t.calcLess }}" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #9CC4E8; background: transparent; color: #ffffff; font-family: inherit; font-size: 22px; cursor: pointer">−</button>
<span style="min-width: 96px; text-align: center; font-weight: 700; font-size: 18px">{{ peopleTxt }}</span>
<button onClick="{{ plus }}" aria-label="{{ t.calcMore }}" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #9CC4E8; background: transparent; color: #ffffff; font-family: inherit; font-size: 22px; cursor: pointer">+</button>
</div>
<div style="display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #9CC4E8">{{ t.calcTotal }}</span>
<span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 40px; line-height: 1.1">{{ calcTotal }} MT</span>
<span style="display: {{ calcSaveDisplay }}; align-self: flex-start; align-items: center; min-height: 32px; padding: 4px 14px; border-radius: 16px; background: #1F8A5B; color: #ffffff; font-size: 16px; font-weight: 700; box-sizing: border-box; margin: 4px 0">{{ calcSave }}</span>
<span style="font-size: 15px; line-height: 1.45; color: #DCEAF6">{{ calcNote }}</span>
</div>
</div>
<a href="{{ calcLink }}" style="display: inline-flex; align-items: center; justify-content: center; min-height: 52px; padding: 0 28px; border-radius: 26px; background: #ffffff; color: #0F2A44; font-weight: 700; font-size: 17px; text-decoration: none">{{ t.calcBtn }}</a>
</div>
</div>

<!-- Outras opções -->
<div id="guiadas" style="max-width: 1120px; margin: 0 auto; padding: 40px 20px 24px; box-sizing: border-box; display: flex; flex-direction: column; gap: 24px">
<h2 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 36px; line-height: 1.1">{{ t.moreTitle }}</h2>
<div style="display: flex; flex-wrap: wrap; gap: 20px">
<div style="flex: 1 1 280px; min-width: 0; background: #ffffff; border-radius: 20px; padding: 24px; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px">
<div style="font-size: 14px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #2B6296">{{ t.guideTag }}</div>
<div style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 24px">{{ t.guideTitle }}</div>
<div style="font-size: 16px; line-height: 1.5">{{ t.guideText }}</div>
<div style="display: {{ guideDisplay }}; flex-direction: column; gap: 14px; padding-top: 6px; border-top: 1px solid #DCE6EF; margin-top: 6px">
<div style="padding-top: 12px"><div style="font-weight: 700; font-size: 16px">{{ t.guideWhoT }}</div><div style="font-size: 16px; line-height: 1.5">{{ t.guideWho }}</div></div>
<div><div style="font-weight: 700; font-size: 16px">{{ t.guideHowT }}</div><div style="font-size: 16px; line-height: 1.5">{{ t.guideHow }}</div></div>
<div><div style="font-weight: 700; font-size: 16px">{{ t.guideSafeT }}</div><div style="font-size: 16px; line-height: 1.5">{{ t.guideSafe }}</div></div>
<div><div style="font-weight: 700; font-size: 16px">{{ t.guidePriceT }}</div><div style="font-size: 16px; line-height: 1.5">{{ t.guidePrice }}</div></div>
<a href="{{ guideLink }}" style="display: inline-flex; align-items: center; justify-content: center; min-height: 52px; padding: 0 28px; border-radius: 26px; background: #3576B0; color: #ffffff; font-weight: 700; font-size: 17px; text-decoration: none; align-self: flex-start">{{ t.guideBtn }}</a>
</div>
<button onClick="{{ toggleGuide }}" aria-expanded="{{ guideOpen }}" style="align-self: flex-start; min-height: 44px; padding: 0 20px; margin-top: 4px; border-radius: 22px; border: 2px solid #3576B0; background: transparent; color: #2B6296; font-family: inherit; font-weight: 700; font-size: 16px; cursor: pointer">{{ guideToggleText }}</button>
</div>
<div style="flex: 1 1 280px; min-width: 0; background: #ffffff; border-radius: 20px; padding: 24px; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px">
<div style="font-size: 14px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #2B6296">{{ t.tripTag }}</div>
<div style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 24px">{{ t.tripTitle }}</div>
<div style="font-size: 16px; line-height: 1.5">{{ t.tripText }}</div>
</div>
</div>
</div>

<!-- Foto -->
<div style="max-width: 1120px; margin: 0 auto; padding: 40px 20px 0; box-sizing: border-box">
<div style="max-width: 760px; margin: 0 auto">
<img loading="lazy" src="aulas.jpg" alt="{{ t.altBand }}" style="display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover; object-position: center; border-radius: 20px">
</div>
</div>

<!-- Como reservar -->
<div id="como" style="max-width: 1120px; margin: 0 auto; padding: 56px 20px 24px; box-sizing: border-box; display: flex; flex-direction: column; gap: 24px">
<h2 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 36px; line-height: 1.1">{{ t.stepsTitle }}</h2>
<div style="display: flex; flex-wrap: wrap; gap: 20px">
<sc-for list="{{ steps }}" as="step" hint-placeholder-count="3">
<div style="flex: 1 1 280px; min-width: 0; display: flex; gap: 16px; align-items: flex-start">
<div style="flex: none; width: 44px; height: 44px; border-radius: 22px; background: #0F2A44; color: #ffffff; display: flex; align-items: center; justify-content: center; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 20px">{{ step.n }}</div>
<div style="font-size: 17px; line-height: 1.5; padding-top: 8px">{{ step.text }}</div>
</div>
</sc-for>
</div>
</div>

<!-- Antes de reservar -->
<div id="perguntas" style="max-width: 1120px; margin: 0 auto; padding: 56px 20px 24px; box-sizing: border-box; display: flex; flex-direction: column; gap: 24px">
<h2 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 36px; line-height: 1.1">{{ t.faqTitle }}</h2>
<div style="display: flex; flex-direction: column; gap: 12px">
<sc-for list="{{ faq }}" as="q" hint-placeholder-count="4">
<div style="background: #ffffff; border-radius: 20px; padding: 18px 24px; box-sizing: border-box; display: flex; flex-direction: column; gap: 8px">
<button onClick="{{ q.onToggle }}" aria-expanded="{{ q.open }}" style="display: flex; justify-content: space-between; align-items: center; gap: 12px; width: 100%; min-height: 44px; padding: 0; border: 0; background: transparent; color: #0F2A44; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 21px; text-align: left; cursor: pointer">
<span>{{ q.title }}</span>
<span style="flex: none; width: 34px; height: 34px; border-radius: 17px; background: #DCEAF6; color: #2B6296; display: inline-flex; align-items: center; justify-content: center; font-size: 22px">{{ q.sign }}</span>
</button>
<div style="display: {{ q.display }}; font-size: 17px; line-height: 1.55; padding-bottom: 6px">{{ q.text }}</div>
</div>
</sc-for>
</div>
<div id="local" style="background: #ffffff; border-radius: 20px; padding: 24px; box-sizing: border-box; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px">
<div style="flex: 1 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 6px">
<div style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 22px">{{ t.meetTitle }}</div>
<div style="font-size: 17px; line-height: 1.55">{{ t.meetText }}</div>
</div>
<a href="{{ mapsLink }}" style="display: inline-flex; align-items: center; justify-content: center; min-height: 52px; padding: 0 28px; border-radius: 26px; background: #0F2A44; color: #ffffff; font-weight: 700; font-size: 17px; text-decoration: none">{{ t.mapBtn }}</a>
</div>
</div>

<!-- Equipa -->
<div id="equipa" style="max-width: 1120px; margin: 0 auto; padding: 56px 20px 64px; box-sizing: border-box">
<div style="background: #0F2A44; color: #ffffff; border-radius: 24px; padding: 40px; box-sizing: border-box; display: flex; flex-direction: column; gap: 32px">
<div style="display: flex; flex-wrap: wrap; gap: 32px; align-items: center">
<div style="flex: 2 1 400px; min-width: 0; display: flex; flex-direction: column; gap: 16px">
<div style="font-size: 14px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #9CC4E8">{{ t.aboutKicker }}</div>
<h2 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 40px; line-height: 1.1"><span style="display: block">{{ t.aboutTitle }}</span><span style="display: block; color: #9CC4E8; padding-top: 6px">{{ t.aboutTitle2 }}</span></h2>
<p style="margin: 0; font-size: 18px; line-height: 1.6">{{ t.aboutP1 }}</p>

function vmqStart() {
  if (typeof window === 'undefined' || window.__vmq) return;
  window.__vmq = true;
  const st = { acc: 0, pos: null, last: 0, resume: 0, down: false, drag: false, sx: 0, sl: 0, el: null, t: 0 };
  window.__vmqSt = st;
  const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const SPEED = 38;
  const hold = () => { st.down = true; };
  const release = () => { st.down = false; st.drag = false; st.resume = performance.now() + 2500; };
  const tick = (ts) => {
    const el = document.querySelector('.vmq');
    const track = el && el.firstElementChild;
    if (el && track && track.scrollWidth > 0) {
      const W = (track.scrollWidth + 12) / 4;
      if (el !== st.el) {
        st.el = el;
        el.scrollLeft = st.pos == null ? W : st.pos;
        st.acc = el.scrollLeft;
        st.last = el.scrollLeft;
        st.resume = performance.now() + 1500;
        el.addEventListener('touchstart', hold, { passive: true });
        el.addEventListener('touchend', release, { passive: true });
        el.addEventListener('touchcancel', release, { passive: true });
        el.addEventListener('pointerdown', (e) => { if (e.pointerType === 'mouse') { st.down = true; st.drag = true; st.sx = e.clientX; st.sl = el.scrollLeft; el.style.cursor = 'grabbing'; } });
        window.addEventListener('pointermove', (e) => { if (st.drag && st.el === el) { if (Math.abs(e.clientX - st.sx) > 6) st.moved = true; el.scrollLeft = st.sl - (e.clientX - st.sx); } });
        const end = () => { if (st.drag) { el.style.cursor = ''; window.__vmqDragged = st.moved ? performance.now() : 0; st.moved = false; release(); } };
        window.addEventListener('pointerup', end);
        window.addEventListener('pointercancel', end);
        window.addEventListener('mouseup', end);
        el.addEventListener('dragstart', (e) => e.preventDefault());
        el.addEventListener('wheel', () => { st.resume = performance.now() + 2500; }, { passive: true });
      }
      const now = performance.now();
      const dt = Math.min(0.05, (ts - (st.t || ts)) / 1000);
      st.t = ts;
      if (Math.abs(el.scrollLeft - st.last) > 2) { st.resume = now + 2500; st.acc = el.scrollLeft; }
      const idle = !st.down && !window.__vlbOpen && now >= st.resume;
      if (idle && !reduce) {
        if (Math.abs(st.acc - el.scrollLeft) > 3) st.acc = el.scrollLeft;
        st.acc += SPEED * dt;
        el.scrollLeft = st.acc;
      }
      if (!st.down && (el.scrollLeft >= 2 * W || el.scrollLeft < W * 0.5)) {
        const nl = el.scrollLeft >= 2 * W ? el.scrollLeft - W : el.scrollLeft + W;
        el.scrollLeft = nl; st.acc = nl;
      }
      st.last = el.scrollLeft;
      st.pos = el.scrollLeft;
    }
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}

function vlbStart() {
  if (typeof window === 'undefined' || window.__vlbInit) return;
  window.__vlbInit = true;
  const d = { on: false, x: 0, y: 0, img: null, box: null };
  document.addEventListener('pointerdown', (e) => {
    const img = e.target && e.target.closest ? e.target.closest('.vlb-img') : null;
    if (!img) return;
    d.on = true; d.x = e.clientX; d.y = e.clientY; d.img = img; d.box = img.parentElement;
    img.style.transition = 'none';
    if (img.setPointerCapture) { try { img.setPointerCapture(e.pointerId); } catch (err) {} }
    e.preventDefault();
  });
  document.addEventListener('pointermove', (e) => {
    if (!d.on) return;
    const dx = e.clientX - d.x, dy = e.clientY - d.y, dist = Math.hypot(dx, dy);
    d.img.style.transform = 'translate(' + dx + 'px,' + dy + 'px) scale(' + Math.max(0.85, 1 - dist / 1500) + ')';
    d.box.style.background = 'rgba(5, 15, 25,' + Math.max(0.35, 0.94 - dist / 500) + ')';
  });
  const up = (e) => {
    if (!d.on) return;
    d.on = false;
    const dist = Math.hypot(e.clientX - d.x, e.clientY - d.y);
    if (dist > 90) {
      d.box.style.background = '';
      if (window.__vlbClose) window.__vlbClose();
    } else {
      d.img.style.transition = 'transform 0.2s ease';
      d.img.style.transform = '';
      d.box.style.background = '';
    }
  };
  document.addEventListener('pointerup', up);
  document.addEventListener('pointercancel', up);
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && window.__vlbOpen && window.__vlbClose) window.__vlbClose(); });
}

const comp = new Component();
const tpl = document.getElementById('tpl');
const root = document.getElementById('root');
function lookup(path, scope){ return path.trim().split('.').reduce((o,k)=> (o==null?undefined:o[k]), scope); }
const HOLE=/\{\{\s*([^}]+?)\s*\}\}/g;
function sub(str, scope){ return str.replace(HOLE,(m,p)=>{ const v=lookup(p,scope); return v==null?'':String(v); }); }
function proc(node, scope){
  if (node.nodeType===3){ if (HOLE.test(node.nodeValue)) { HOLE.lastIndex=0; node.nodeValue=sub(node.nodeValue,scope);} HOLE.lastIndex=0; return; }
  if (node.nodeType!==1) return;
  if (node.tagName==='SC-FOR'){
    const list=lookup(node.getAttribute('list').replace(/[{}]/g,''),scope)||[];
    const as=node.getAttribute('as'); const frag=document.createDocumentFragment();
    list.forEach(item=>{ const s=Object.assign({},scope,{[as]:item}); Array.from(node.childNodes).forEach(c=>{ const cl=c.cloneNode(true); frag.appendChild(cl); proc(cl,s); }); });
    node.replaceWith(frag); return;
  }
  Array.from(node.attributes).forEach(a=>{
    if (!a.value.includes('{{')) return;
    if (/^on/i.test(a.name)){ const fn=lookup(a.value.replace(/[{}]/g,''),scope); node.removeAttribute(a.name); if (typeof fn==='function') node.addEventListener(a.name.slice(2).toLowerCase(), fn); }
    else node.setAttribute(a.name, sub(a.value,scope));
  });
  Array.from(node.childNodes).forEach(c=>proc(c,scope));
}
function render(){
  const vals=comp.renderVals();
  const frag=tpl.content.cloneNode(true);
  Array.from(frag.childNodes).forEach(c=>proc(c,vals));
  root.replaceChildren(frag);
  document.documentElement.lang = comp.state.lang;
}
render();
